<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Práctica HTML5 - Vídeo, Audio e Iframe</title>

    <!-- Favicon -->
    <link rel="icon" href="recursos/favicon-32x32.png"
          sizes="32x32" type="image/png">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #222;
        }

        header {
            background-color: #d9eaff;
            padding: 20px;
            border-radius: 8px;
        }

        h1 {
            color: #2471c8;
        }

        h2 {
            color: #2471c8;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }

        video {
            width: 600px;
            max-width: 100%;
            height: 400px;
        }

        audio {
            width: 500px;
            max-width: 100%;
        }

        iframe {
            width: 100%;
            max-width: 700px;
            height: 400px;
            border: 0;
            margin-bottom: 15px;
        }

        .youtube {
            width: 560px;
            max-width: 100%;
            height: 315px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Práctica Vídeo y Audio con HTML5</h1>
        <p>Práctica de etiquetas de vídeo, audio, favicon e iframe.</p>
    </header>

    <!-- 1. ETIQUETAS DE VÍDEO Y AUDIO -->
    <section>
        <h2>1. Etiquetas Vídeo y Audio</h2>

        <h3>Manejo de vídeo en HTML5</h3>

        <video controls poster="recursos/portada.jpg" autoplay loop muted>
            <source src="recursos/ClubJavaMaster.mp4" type="video/mp4">
            <source src="recursos/ClubJavaMaster.webm" type="video/webm">
            <source src="recursos/ClubJavaMaster.ogv" type="video/ogg">

            Tu navegador no admite la reproducción de vídeo.
        </video>

        <h3>Manejo de audio en HTML5</h3>

        <audio controls autoplay loop>
            <source src="recursos/IntroGlobalMentoring.mp3" type="audio/mpeg">
            <source src="recursos/IntroGlobalMentoring.m4a" type="audio/mp4">
            <source src="recursos/IntroGlobalMentoring.ogg" type="audio/ogg">

            Tu navegador no admite la reproducción de audio.
        </audio>
    </section>

    <section>
        <h2>2. Etiqueta Iframe</h2>

        <h3>Ejemplo 1: Insertar otras páginas</h3>

        <iframe
            src="https://www.marca.com"
            title="Periódico Marca">
        </iframe>

        <iframe
            src="https://www.elmundo.es"
            title="Periódico El Mundo">
        </iframe>

        <h3>Ejemplo 2: Vídeo de YouTube</h3>

        <iframe
            class="youtube"
            src="https://www.youtube.com/embed/Ekabc74IU7o"
            title="Vídeo de YouTube"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>

        <h3>Ejemplo 3: Mapa de Google Maps</h3>

        <iframe
            src="https://maps.google.com/maps?q=El%20Bosco&t=&z=13&ie=UTF8&iwloc=&output=embed"
            title="Mapa de Google Maps"
            loading="lazy"
            allowfullscreen>
        </iframe>
    </section>

</body>
</html>
